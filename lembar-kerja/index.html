<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lembar Kerja: Siap?</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --orange:#f26b1d; --orange-soft:#fff3ea; --line:#f59a5c;
  --bg:#fdf6ef; --card:#ffffff; --text:#2b2118; --muted:#6b5a4d; --field:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --orange:#ff8238; --orange-soft:#3a2518; --line:#b8602b;
    --bg:#1c1511; --card:#261c16; --text:#f6ebe1; --muted:#c3ad9b; --field:#1c1511;
  }
}
:root[data-theme="dark"]{
  --orange:#ff8238; --orange-soft:#3a2518; --line:#b8602b;
  --bg:#1c1511; --card:#261c16; --text:#f6ebe1; --muted:#c3ad9b; --field:#1c1511;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Nunito","Segoe UI",system-ui,-apple-system,Arial,sans-serif;line-height:1.5}
.page{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
.sheet{background:var(--card);border:3px solid var(--orange);border-radius:24px;padding:24px}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.badge{display:flex;align-items:center;gap:10px;background:var(--orange);color:#fff;
  font-weight:800;font-size:1.35rem;padding:8px 22px 8px 8px;border-radius:999px}
.badge i{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--orange);
  display:grid;place-items:center;font-style:normal;font-size:1.4rem}
.head p{margin:0;font-weight:700;flex:1;min-width:220px}
.who{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:22px}
.who label{display:block;font-weight:700;font-size:.9rem;color:var(--muted);margin-bottom:4px}
input[type=text],textarea{width:100%;font:inherit;color:var(--text);background:var(--field);
  border:2px solid var(--line);border-radius:14px;padding:10px 14px;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 30%,transparent)}
textarea{min-height:120px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-items:start}
.col{display:flex;flex-direction:column}
.q{padding:16px 0;border-bottom:2px dashed var(--line)}
.col .q:last-child{border-bottom:0}
.q h2{display:flex;gap:12px;align-items:flex-start;margin:0 0 10px;font-size:1.02rem;font-weight:700}
.num{flex:none;width:28px;height:28px;border-radius:8px;background:var(--orange);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:.95rem}
.actions{display:flex;justify-content:center;margin-top:26px}
.btn{background:var(--orange);color:#fff;border:0;border-radius:999px;font:inherit;font-weight:800;
  font-size:1.15rem;padding:16px 40px;cursor:pointer;width:min(100%,380px)}
.btn:hover{filter:brightness(1.06)}
.btn:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.note{text-align:center;color:var(--muted);font-size:.85rem;margin:10px 0 0}
@media (max-width:720px){
  .grid{grid-template-columns:1fr}
  .col .q:last-child{border-bottom:2px dashed var(--line)}
  .grid .col:last-child .q:last-child{border-bottom:0}
  .who{grid-template-columns:1fr}
  .sheet{padding:16px;border-radius:20px}
}
.print-only{display:none}
@media print{
  :root{--bg:#fff;--card:#fff;--text:#000;--muted:#444;--field:#fff;--orange:#f26b1d;--line:#f59a5c}
  body{background:#fff}
  .no-print{display:none!important}
  .page{padding:0;max-width:none}
  .sheet{border-width:2px;box-shadow:none}
  .q{break-inside:avoid}
  textarea{resize:none;border-color:#f59a5c;overflow:visible}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<main class="page">
  <section class="sheet">
    <div class="head">
      <div class="badge"><i>?</i>Siap?</div>
      <p>Ambil buku catatan Ale, lalu jawab pertanyaan berikut ya!</p>
    </div>

    <div class="who">
      <div><label for="nama">Nama</label><input type="text" id="nama" placeholder="Tulis namamu" autocomplete="name"></div>
      <div><label for="kelas">Kelas</label><input type="text" id="kelas" placeholder="Contoh: 6A" autocomplete="off"></div>
    </div>

    <div class="grid">
      <div class="col">
        <div class="q"><h2><span class="num">1</span><label for="j1">Mengapa lampu bisa menyala ketika dihubungkan dengan baterai?</label></h2><textarea id="j1" placeholder="Ketik jawabanmu di sini…"></textarea></div>
        <div class="q"><h2><span class="num">2</span><label for="j2">Mengapa kabel charger bisa terasa panas?</label></h2><textarea id="j2" placeholder="Ketik jawabanmu di sini…"></textarea></div>
      </div>
      <div class="col">
        <div class="q"><h2><span class="num">3</span><label for="j3">Apa yang terjadi jika terlalu banyak alat listrik digunakan bersamaan?</label></h2><textarea id="j3" placeholder="Ketik jawabanmu di sini…"></textarea></div>
        <div class="q"><h2><span class="num">4</span><label for="j4">Menurut Ale, apa fungsi baterai dalam rangkaian listrik?</label></h2><textarea id="j4" placeholder="Ketik jawabanmu di sini…"></textarea></div>
        <div class="q"><h2><span class="num">5</span><label for="j5">Mengapa masyarakat di pulau kecil perlu menggunakan listrik secara hemat?</label></h2><textarea id="j5" placeholder="Ketik jawabanmu di sini…"></textarea></div>
      </div>
    </div>

    <div class="actions no-print">
      <button class="btn" id="unduh" type="button">Unduh Jawaban (PDF)</button>
    </div>
    <p class="note no-print">Di jendela cetak, pilih “Simpan sebagai PDF” sebagai printer.</p>
  </section>
</main>
<script>
(function(){
  var btn=document.getElementById('unduh');
  var ids=['nama','kelas','j1','j2','j3','j4','j5'];
  // Auto-grow textarea so full answers show in the PDF
  function grow(t){t.style.height='auto';t.style.height=Math.max(120,t.scrollHeight+2)+'px';}
  document.querySelectorAll('textarea').forEach(function(t){t.addEventListener('input',function(){grow(t)});});
  window.addEventListener('beforeprint',function(){
    document.querySelectorAll('textarea').forEach(grow);
    var n=document.getElementById('nama').value.trim();
    document.title='Jawaban - '+(n||'Siswa');
  });
  btn.addEventListener('click',function(){
    var n=document.getElementById('nama').value.trim();
    if(!n){
      var ok=window.confirm('Nama belum diisi. Tetap lanjut mengunduh?');
      if(!ok){document.getElementById('nama').focus();return;}
    }
    window.print();
  });
})();
</script>
</body>
</html>
